name: Set up
description: Bun, locked dependencies and the runner's Chrome with its normal sandbox
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.11
    - run: bun install --frozen-lockfile
      shell: bash
    # Ubuntu already allows the installed Chrome stable binary through its AppArmor profile.
    - run: google-chrome --version
      shell: bash
