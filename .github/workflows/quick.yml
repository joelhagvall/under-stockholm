# The quick gates (`bun run check --quick`) on a clean checkout: what the pre-push hook ran, without the files that only
# live on the developer's machine. Frame rates stay local: the runners have no GPU.
name: Quick
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: bun run check --quick
      - name: Save the gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick
          path: perf/last-run.json
          if-no-files-found: ignore
          retention-days: 7
